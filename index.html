<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Vida 3D</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }
    #ui {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(20, 20, 30, 0.85);
      color: #ffffff;
      padding: 16px;
      border-radius: 10px;
      width: 220px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }
    #ui h3 {
      margin: 0 0 12px 0;
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #00d2ff;
    }
    .stat-label {
      font-size: 12px;
      margin-bottom: 4px;
      display: block;
    }
    .bar-container {
      width: 100%;
      background: #333;
      height: 14px;
      border-radius: 7px;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .bar {
      height: 100%;
      width: 100%;
      transition: width 0.2s ease-out;
    }
    #energy-bar { background: #4caf50; }
    #hunger-bar { background: #ff9800; }
    #happiness-bar { background: #2196f3; }
    #prompt {
      position: absolute;
      bottom: 30px;
      width: 100%;
      text-align: center;
      color: #ffffff;
      font-size: 18px;
      font-weight: 600;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
      pointer-events: none;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui">
    <h3>Status do Sim</h3>
    <span class="stat-label">Energia</span>
    <div class="bar-container"><div id="energy-bar" class="bar"></div></div>
    
    <span class="stat-label">Fome</span>
    <div class="bar-container"><div id="hunger-bar" class="bar"></div></div>
    
    <span class="stat-label">Felicidade</span>
    <div class="bar-container"><div id="happiness-bar" class="bar"></div></div>
  </div>

  <div id="prompt">Use W, A, S, D para andar. Aproxime-se dos objetos para interagir.</div>

  <script>
    // 1. Configuração da Cena e Câmera
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xd0e8ff);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 10, 14);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // 2. Iluminação
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xffffff, 0.7);
    sunLight.position.set(12, 20, 10);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    scene.add(sunLight);

    // 3. Cenário (Piso e Paredes)
    const floorGeo = new THREE.PlaneGeometry(20, 20);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // 4. Personagem
    const playerGeo = new THREE.BoxGeometry(1, 1.8, 1);
    const playerMat = new THREE.MeshStandardMaterial({ color: 0x0088ff });
    const player = new THREE.Mesh(playerGeo, playerMat);
    player.position.set(0, 0.9, 0);
    player.castShadow = true;
    scene.add(player);

    // 5. Objetos Interativos
    const interactiveObjects = [];

    function createObject(geo, matColor, pos, name, interactionEffect) {
      const mat = new THREE.MeshStandardMaterial({ color: matColor });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(pos.x, pos.y, pos.z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.userData = { name: name, interact: interactionEffect };
      scene.add(mesh);
      interactiveObjects.push(mesh);
    }

    // Cama (Verde) -> Restaura Energia
    createObject(
      new THREE.BoxGeometry(2.5, 0.6, 4),
      0x2e7d32,
      { x: -7, y: 0.3, z: -7 },
      "Cama (Dormir)",
      () => { stats.energy = Math.min(100, stats.energy + 35); }
    );

    // Geladeira (Branca/Cinza) -> Restaura Fome
    createObject(
      new THREE.BoxGeometry(1.6, 3, 1.6),
      0xdddddd,
      { x: 7, y: 1.5, z: -7 },
      "Geladeira (Comer)",
      () => { stats.hunger = Math.min(100, stats.hunger + 30); }
    );

    // Computador (Roxo) -> Restaura Felicidade
    createObject(
      new THREE.BoxGeometry(2, 1.2, 2),
      0x7b1fa2,
      { x: 7, y: 0.6, z: 7 },
      "Computador (Jogar)",
      () => { stats.happiness = Math.min(100, stats.happiness + 25); }
    );

    // 6. Atributos do Sim
    const stats = { energy: 100, hunger: 100, happiness: 100 };
    let currentFocusObject = null;

    // 7. Controles do Jogador
    const keys = {};
    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      keys[k] = true;
      if (k === 'e' && currentFocusObject) {
        currentFocusObject.userData.interact();
      }
    });
    window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

    // 8. Loop Principal
    function animate() {
      requestAnimationFrame(animate);

      // Movimento do Personagem
      const speed = 0.15;
      if (keys['w'] || keys['arrowup']) player.position.z -= speed;
      if (keys['s'] || keys['arrowdown']) player.position.z += speed;
      if (keys['a'] || keys['arrowleft']) player.position.x -= speed;
      if (keys['d'] || keys['arrowright']) player.position.x += speed;

      // Limites do cômodo
      player.position.x = Math.max(-9, Math.min(9, player.position.x));
      player.position.z = Math.max(-9, Math.min(9, player.position.z));

      // Suavização de Câmera seguindo o jogador
      camera.position.x = THREE.MathUtils.lerp(camera.position.x, player.position.x, 0.05);
      camera.position.z = THREE.MathUtils.lerp(camera.position.z, player.position.z + 12, 0.05);
      camera.lookAt(player.position.x, player.position.y, player.position.z);

      // Decaimento natural dos status
      stats.energy = Math.max(0, stats.energy - 0.015);
      stats.hunger = Math.max(0, stats.hunger - 0.025);
      stats.happiness = Math.max(0, stats.happiness - 0.01);

      // Atualização da Interface (UI)
      document.getElementById('energy-bar').style.width = stats.energy + '%';
      document.getElementById('hunger-bar').style.width = stats.hunger + '%';
      document.getElementById('happiness-bar').style.width = stats.happiness + '%';

      // Checagem de Proximidade para Interação
      currentFocusObject = null;
      for (let obj of interactiveObjects) {
        if (player.position.distanceTo(obj.position) < 2.8) {
          currentFocusObject = obj;
          break;
        }
      }

      const promptEl = document.getElementById('prompt');
      if (currentFocusObject) {
        promptEl.innerText = `Pressione 'E' para interagir com: ${currentFocusObject.userData.name}`;
      } else {
        promptEl.innerText = "Use W, A, S, D para andar. Aproxime-se dos objetos para interagir.";
      }

      renderer.render(scene, camera);
    }

    // Ajuste de Tela Responsiva
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
